      <stop offset="0%" stop-color="#f4a48b"/>
      <stop offset="50%" stop-color="#ed8d8d"/>
      <stop offset="100%" stop-color="#c93e88"/>
    </linearGradient>
    <radialGradient id="faceF" cx="0.4" cy="0.35" r="0.7">
